name: Mirror Google Sheet (durable backup)

# Hourly software backup of the published Google Sheet. The live site already
# survives a deleted sheet (build falls back to the data.js baseline); this
# protects the *edits* made in the sheet since they were last baked in, which
# are otherwise un-backed-up. snapshot-sheet.mjs validates the fetch (rejecting
# HTML error pages, empty bodies, and row collapses) and only writes when the
# content is both healthy AND changed, so a broken sheet never clobbers the
# last known-good copy.
#
# A committed change here pushes to main, which Cloudflare Pages rebuilds from,
# so a sheet edit is mirrored to git and live within the hour, and the backup
# is what the build reads if the sheet is ever gone.

on:
  schedule:
    - cron: '17 * * * *'   # hourly at :17
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mirror-sheet
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Snapshot sheet
        run: node snapshot-sheet.mjs

      - name: Commit if changed
        run: |
          git config user.name  "sheet-mirror[bot]"
          git config user.email "sheet-mirror[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain backup)" ]; then
            git add backup
            git commit -m "Mirror Google Sheet snapshot ($(date -u +%FT%TZ))"
            git push
            echo "✓ Committed new snapshot"
          else
            echo "No change to mirror"
          fi
