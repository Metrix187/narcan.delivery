name: Build check

# Runs the prerender build on every push / PR to make sure nothing broke
# before Cloudflare Pages picks it up.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '20' }
      - name: Tests (data validation gate)
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify outputs
        run: |
          test -f index.html
          test -f data.json
          test -f sitemap.xml
          test -f sw.js
          test -f states/california/index.html
          test -f es/card/index.html
          echo "✓ All expected files present"
